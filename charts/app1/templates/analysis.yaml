apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 5s
      count: 60
      initialDelay: 5s
      successCondition: result[0] <= 0.9
      failureLimit: 3
      provider:
        prometheus:
          address: http://prom-stack-kube-prometheus-prometheus.kubernetes-mcp-server.svc.cluster.local:9090
          query: |
            sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/color-app/display-site-app1/rule/0", envoy_response_code_class!="2"}[5m]))/sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/color-app/display-site-app1/rule/0"}[5m]))